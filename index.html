<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"><title>Stepora Movement – Whitepaper</title>
<style>
:root{--bg:#05070f;--side:#070b16;--card:#0b1224;--line:#16223d;--tx:#e6e9ef;--mu:#8b94a6;--ac:#22d3ee;--acbg:#0a2233;--hl:#0c1f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--side:#f7f8fa;--card:#f5f7fa;--line:#e3e7ee;--tx:#1b2230;--mu:#667085;--ac:#2459c4;--acbg:#e8f0ff;--hl:#eaf1ff}}
:root[data-theme="light"]{--bg:#fff;--side:#f7f8fa;--card:#f5f7fa;--line:#e3e7ee;--tx:#1b2230;--mu:#667085;--ac:#2459c4;--acbg:#e8f0ff;--hl:#eaf1ff}
:root[data-theme="dark"]{--bg:#05070f;--side:#070b16;--card:#0b1224;--line:#16223d;--tx:#e6e9ef;--mu:#8b94a6;--ac:#22d3ee;--acbg:#0a2233;--hl:#0c1f3a}
*{box-sizing:border-box}html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{font:700 17px ui-monospace,Menlo,monospace;color:var(--ac);letter-spacing:.5px}
.sep{width:1px;height:24px;background:var(--line)}.wp{color:var(--mu);font-weight:500}
.sp{flex:1}.btn{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
#menu{display:none}
.wrap{display:flex}
nav{width:280px;flex:none;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:14px 0}
nav h6{margin:18px 20px 6px;font-size:11px;letter-spacing:1.2px;color:var(--mu);font-weight:600}
nav a{display:flex;gap:10px;align-items:center;padding:8px 20px;color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:var(--card)}nav a.on{background:var(--acbg);color:var(--ac);border-left-color:var(--ac);font-weight:600}
main{flex:1;min-width:0;display:flex;justify-content:center;gap:48px;padding:40px 32px 80px}
article{width:100%;max-width:728px;min-width:0}
aside{width:200px;flex:none;position:sticky;top:96px;align-self:flex-start;font-size:13px}
aside b{display:block;font-size:11px;letter-spacing:1.2px;color:var(--mu);margin-bottom:10px}
aside a{display:block;color:var(--mu);text-decoration:none;padding:4px 0 4px 14px;border-left:1px solid var(--line);cursor:pointer}aside a:hover{color:var(--ac)}
h1{font-size:32px;line-height:1.2;margin:0 0 16px}h2{font-size:22px;margin:36px 0 10px}
p,li{color:var(--mu)}li{margin:4px 0}strong{color:var(--tx)}
.call{display:flex;gap:12px;background:var(--hl);border-left:3px solid var(--ac);border-radius:6px;padding:14px 18px;margin:20px 0;color:var(--tx);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card .i{font-size:22px}.card b{display:block;margin:10px 0 4px;color:var(--tx)}.card span{color:var(--mu);font-size:13.5px;line-height:1.5;display:block}
.tw{overflow-x:auto;margin:16px 0}table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}th,td{text-align:left;padding:10px 14px;border:1px solid var(--line)}th{background:var(--card);color:var(--tx)}td{color:var(--mu)}
.next{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:14px}
.next div{flex:1;border:1px solid var(--line);border-radius:10px;padding:16px 20px;cursor:pointer;background:var(--card)}.next div:hover{border-color:var(--ac)}
.next small{color:var(--mu);font-size:12px;letter-spacing:1px}.next b{display:block}.next .r{text-align:right}
.hero{text-align:center;margin-bottom:12px}.hero img{width:180px;border-radius:24px}.shots{margin:16px 0;display:flex;gap:16px;flex-wrap:wrap}.shot{width:100%;max-width:260px;border-radius:14px;border:1px solid var(--line)}.shoe img{width:100%;border-radius:8px;background:#fff}.shoe span{font-size:13px}.logos{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}.lg{text-align:center;color:var(--mu);font-size:12px}.lg img{display:block;width:64px;height:64px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;margin-bottom:4px}.hdr{width:28px;height:28px;border-radius:7px}.note{font-size:12.5px;color:var(--mu);margin-top:28px}
@media(max-width:1100px){aside{display:none}}
@media(max-width:800px){#menu{display:block}nav{position:fixed;z-index:6;left:0;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:.2s}nav.open{transform:none}main{padding:28px 18px 60px}h1{font-size:26px}}

body{background:radial-gradient(900px 500px at 88% -10%,rgba(139,92,246,.2),transparent),radial-gradient(700px 420px at 0% 0%,rgba(34,211,238,.13),transparent),var(--bg);background-attachment:fixed;font-family:"Space Grotesk",Inter,system-ui,sans-serif}
h1{background:linear-gradient(90deg,var(--tx),var(--ac) 55%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
h2{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ac)}
.logo{background:linear-gradient(90deg,var(--ac),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(160deg,var(--card),transparent);backdrop-filter:blur(6px);transition:.2s}.card:hover{border-color:var(--ac);box-shadow:0 0 28px -10px var(--ac)}
nav a.on{box-shadow:inset 0 0 24px rgba(34,211,238,.1)}
.tag{display:inline-block;font:600 11px ui-monospace,monospace;letter-spacing:1.8px;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:3px 12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:22px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}.stat b{display:block;font:700 22px ui-monospace,monospace;color:var(--ac)}.stat span{font-size:10.5px;letter-spacing:1.2px;color:var(--mu);text-transform:uppercase}
.lead{font-size:18px;color:var(--tx)}.hero img{box-shadow:0 0 60px -10px var(--ac)}
.flow{counter-reset:s}.flow .card:before{counter-increment:s;content:"0" counter(s);font:700 12px ui-monospace,monospace;color:#8b5cf6;letter-spacing:1px}
#lm{position:fixed;inset:0;z-index:50;background:rgba(2,4,10,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.lbox{background:var(--card);border:1px solid var(--ac);box-shadow:0 0 60px -12px var(--ac);border-radius:18px;padding:28px;width:100%;max-width:360px;text-align:center;color:var(--tx)}.lbox img{width:84px;border-radius:18px}.lbox h3{margin:14px 0 18px;font-size:19px}.lbox small{color:var(--mu);font-weight:400;font-size:14px}.lbox button{display:block;width:100%;margin:10px 0 0;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:600 16px inherit;font-family:inherit;cursor:pointer}.lbox button:hover{border-color:var(--ac);box-shadow:0 0 20px -6px var(--ac)}</style></head><body>

const PE=[
["Protocol","◈","Overview",`<div class="hero">${I("logo")}</div><span class="tag">MOVE-TO-EARN PROTOCOL</span><h1>Stepora Movement</h1><p class="lead">Move with purpose. Earn with every step.</p><p>Stepora is a Move-to-Earn platform that turns verified outdoor movement into on-platform rewards. Virtual runner assets set the earning rate, a verification engine validates every workout, and team Marathons pool distance into shared bounties.</p><div class="stats">${S("4","Runner tiers")}${S("₱40","Top rate / km")}${S("35 km","Max cap / runner")}${S("7 days","Marathon window")}</div><h2 id="p">Core Pillars</h2><div class="grid">${C("📍","Proof of Movement","GPS routes and sensor data are checked before anything is credited.")}${C("👟","Runner Assets","Four runner tiers define reward rate, distance cap and cooldown.")}${C("⚡","Reward Engine","Eligible distance × runner rate, capped per runner and summed.")}${C("🏁","Team Marathons","5–10 player pools race a 250 or 500 km target in 7 days.")}${C("🔗","Referral Network","Referral rewards start when a referred member buys their first runner.")}${C("💱","Payment Rails","GCash, Maya, GoTyme, QRPh and USDT (TRC20).")}</div>`,["Core Pillars"]],
["Protocol","🔁","Move-to-Earn Loop",`<span class="tag">HOW IT WORKS</span><h1>Move-to-Earn Loop</h1><p>The core loop is four steps and repeats with every workout.</p><div class="grid flow">${C("👟","Equip","Select one or more owned runners that are off cooldown.")}${C("🏃","Move","Record an outdoor workout with GPS and motion sensors.")}${C("🛡️","Verify","Submit with End &amp; Earn for route, timing and ownership checks.")}${C("💰","Earn","Verified distance converts to a balance credit, once per workout.")}</div><div class="shots">${I("dash","shot")}${I("track","shot")}</div><p>Live figures during a workout, including estimated earnings, are provisional. Only a successful <strong>End &amp; Earn</strong> finalizes a reward.</p>`,[]],
["Protocol","🛡️","Proof of Movement",`<span class="tag">VERIFICATION</span><h1>Proof of Movement</h1><p>Rewards are issued only for movement that can be substantiated. Each submitted workout is evaluated on the server.</p><div class="grid">${C("🗺️","GPS Route","The stored route is the primary source of eligible distance.")}${C("📡","Sensor Fallback","Plausible step-sensor data is used when no route exists.")}${C("⏱️","Timing Evidence","Movement must be consistent with elapsed active time.")}${C("🔐","Ownership Check","Selected runners must belong to the account.")}</div><h2 id="t">Tracked Metrics</h2><p>Steps, distance, active time (pauses excluded), estimated calories and the route. Calories are informational and are not a reward currency.</p><h2 id="s">Cross-Device Sync</h2><p>Progress is saved locally and synced when online. Signing in elsewhere pauses the account workout on the previous device, and the new device restores the last synced state. Unsynced offline progress cannot be restored on another device. Switching between Wi-Fi and mobile data does not reset a workout.</p>`,["Tracked Metrics","Cross-Device Sync"]],
["Assets","👟","Runners",`<span class="tag">RUNNER ASSETS</span><h1>Runners</h1><p>Runners are virtual gear assets. Each defines a reward rate per kilometer and a maximum distance that counts toward a workout.</p><div class="grid">${R("cyber","Cyber Aero Walker","₱500","₱3",6)}${R("bio","Bio Surge Trainer","₱1,000","₱5",10)}${R("cobalt","Cobalt Aero Jogger","₱2,000","₱7",20)}${R("vortex","Vortex Blaze Sprint","₱3,500","₱10",35)}</div>${T(["Runner","Price","Rate / km","Max distance","Health","Repair cost / health"],[["Cyber Aero Walker","₱500","₱3","6 km","10","₱10"],["Bio Surge Trainer","₱1,000","₱5","10 km","10","₱10"],["Cobalt Aero Jogger","₱2,000","₱7","20 km","10","₱10"],["Vortex Blaze Sprint","₱3,500","₱10","35 km","10","₱10"]])}<figure style="margin:24px 0"><img src="images/stepora-30-day-roi.png" alt="30-day ROI breakdown for runner packages: ₱500 at ₱3 per kilometer, ₱1,000 at ₱5 per kilometer, ₱2,000 at ₱7 per kilometer, and ₱3,500 at ₱10 per kilometer." loading="lazy" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px"><figcaption class="note">30-day earnings illustration based on each runner's daily distance limit.</figcaption></figure><p>Each completed workout deducts 1 health from every runner used. Repair costs ₱10 per health point restored, so restoring all 10 health costs ₱100.</p><div class="shots">${I("market","shot")}</div><h2 id="c">Cooldown</h2><p>A runner used in a completed workout enters a 12-hour cooldown before it can be used again.</p>`,["Cooldown"]],
["Economy","⚡","Reward Engine",`<span class="tag">REWARD ENGINE</span><h1>Reward Engine</h1><div class="call">reward = Σ ( min(distance, runner cap) × runner rate )</div><p>The calculation runs separately per selected runner, with distance limited by that runner's cap, and the results are added together. The cap is a ceiling for calculation, not a target.</p><div class="stats">${S("4 km","Example distance")}${S("₱3","Cyber Aero rate / km")}${S("₱12","Pre-verification")}</div><p>Workouts that fail verification can receive less than the estimate or nothing. Each workout is credited once.</p>`,[]],
["Economy","🏁","Team Marathons",`<span class="tag">TEAM POOLS</span><h1>Team Marathons</h1><div class="shots">${I("marathon","shot")}</div><p>Marathons are time-limited team challenges in which verified distance accumulates toward a shared target. A lobby needs 5 to 10 accepted players.</p>${T(["Target","Bounty pool","Window"],[["250 km","₱1,000","7 days"],["500 km","₱2,500","7 days"]])}<h2 id="e">Entry Requirements</h2><p>Every player must own both the Cobalt Aero Jogger and the Vortex Blaze Sprint and clear cooldown and workout-state checks. Each player's equal contribution is deducted from balance at start.</p><h2 id="o">Settlement</h2><ul><li><strong>Target reached in time:</strong> the full pool splits equally across the active roster.</li><li><strong>Target missed:</strong> contributions are refunded and no bounty is paid.</li></ul><p>Started-race participants, including players who leave early, receive a three-day cooldown.</p>`,["Entry Requirements","Settlement"]],
["Economy","💱","Wallet &amp; Rails",`<span class="tag">PAYMENT RAILS</span><h1>Wallet &amp; Rails</h1><div class="logos">${L("gcash","GCash")}${L("maya","Maya")}${L("gotyme","GoTyme")}${L("bank","QRPh")}${L("usdt","USDT")}</div><h2 id="d">Deposits</h2>${T(["Rail","Minimum"],[["GCash, Maya, GoTyme, QRPh","₱100"],["USDT (TRC20)","₱800"]])}<p>Balance is credited only after the payment is confirmed as paid.</p><h2 id="w">Withdrawals</h2><p>Payouts go to a saved GCash, Maya or GoTyme account, minimum ₱100, and require Google Authenticator 2FA. A 2% fee is added: a ₱100 payout deducts ₱102 in total. Requests stay pending until accepted and processed, and rejected requests are refunded.</p>`,["Deposits","Withdrawals"]],
["Network","🔗","Referral Network",`<span class="tag">REFERRALS</span><h1>Referral Network</h1><div class="shots">${I("team","shot")}</div><p>Every account receives a unique <strong>NT######</strong> referral code and a shareable invite link. New accounts register through the code or link, and the referral pass is separate from Marathon membership.</p><h2 id="rb">Referral Reward Rules</h2><p>Each new member’s first runner purchase starts a separate reward calculation from that member’s direct inviter.</p><ul><li>A reward calculation starts when a referred member buys their first runner.</li><li>The member’s direct inviter receives ₱100 for that purchase.</li><li>The next two eligible ancestors in the member’s referral chain each receive ₱50.</li><li>No one beyond those three generations receives a reward for that purchase.</li><li>A person may receive rewards from multiple different referrals. Buying additional runners—or a referred member buying additional runners—does not trigger another reward for that same member.</li></ul><h2>Example</h2><div class="call"><strong>Alex → Joshua → Julia → Gerald → Kim</strong><br>When Kim buys their first runner, Gerald receives ₱100, Julia receives ₱50, and Joshua receives ₱50. Alex receives nothing because Alex is beyond the three eligible generations for Kim’s purchase.</div>`,[]],
["Reference","📖","Glossary",`<h1>Glossary</h1>${T(["Term","Meaning"],[["Runner","Virtual gear asset that sets rate, cap and cooldown."],["Rate","Reward per eligible km, subject to verification."],["Distance cap","Maximum distance counted per runner."],["Cooldown","Period a runner or Marathon entry is unavailable."],["Estimated reward","Live provisional amount, not yet credited."],["Verified reward","Amount credited after End &amp; Earn checks."],["Bounty pool","Total split across the active roster on success."],["Active roster","Players still on the team at completion."]])}<p class="note">Rates, limits and fees are current settings and may change.</p>`,[]]];

["Protocol","◈","Pangkalahatang-ideya",`<div class="hero">${I("logo")}</div><span class="tag">MOVE-TO-EARN PROTOCOL</span><h1>Stepora Movement</h1><p class="lead">Kumilos nang may layunin. Kumita sa bawat hakbang.</p><p>Ang Stepora ay isang Move-to-Earn platform na ginagawang gantimpala ang beripikadong paggalaw sa labas. Ang mga virtual runner ang nagtatakda ng rate ng kita, bineberipika ng verification engine ang bawat workout, at pinagsasama ng team Marathon ang distansya para sa sama-samang bounty.</p><div class="stats">${S("4","Antas ng runner")}${S("₱40","Pinakamataas na rate / km")}${S("35 km","Max cap / runner")}${S("7 araw","Palugit ng Marathon")}</div><h2>Mga Pangunahing Haligi</h2><div class="grid">${C("📍","Proof of Movement","Sinusuri ang GPS route at sensor data bago magbigay ng anumang gantimpala.")}${C("👟","Mga Runner Asset","Apat na antas ng runner ang nagtatakda ng rate, distance cap at cooldown.")}${C("⚡","Reward Engine","Kwalipikadong distansya × rate ng runner, may cap kada runner at pinagsasama.")}${C("🏁","Team Marathon","Ang mga pool ng 5–10 manlalaro ay naglalaban sa 250 o 500 km sa loob ng 7 araw.")}${C("🔗","Referral Network","Nagsisimula ang hiwalay na kalkulasyon ng referral reward kapag binili ng inimbitahang miyembro ang una nilang runner.")}${C("💱","Mga Payment Rail","GCash, Maya, GoTyme, QRPh at USDT (TRC20).")}</div>`],
["Protocol","🔁","Move-to-Earn Loop",`<span class="tag">PAANO GUMAGANA</span><h1>Move-to-Earn Loop</h1><p>Apat na hakbang ang pangunahing loop at inuulit sa bawat workout.</p><div class="grid flow">${C("👟","Mag-equip","Pumili ng isa o higit pang pag-aari na runner na hindi naka-cooldown.")}${C("🏃","Gumalaw","Mag-record ng outdoor workout gamit ang GPS at motion sensor.")}${C("🛡️","Beripikahin","Isumite gamit ang End &amp; Earn para sa pagsusuri ng route, oras at pagmamay-ari.")}${C("💰","Kumita","Ang beripikadong distansya ay nagiging credit sa balance, isang beses kada workout.")}</div><div class="shots">${I("dash","shot")}${I("track","shot")}</div><p>Pansamantala lamang ang mga numero habang nag-wo-workout, kasama ang tinatayang kita. Ang matagumpay na <strong>End &amp; Earn</strong> lang ang nagpapatibay ng gantimpala.</p>`],
["Protocol","🛡️","Proof of Movement",`<span class="tag">BERIPIKASYON</span><h1>Proof of Movement</h1><p>Gantimpala lamang ang ibinibigay sa paggalaw na mapapatunayan. Sinusuri sa server ang bawat isinumiteng workout.</p><div class="grid">${C("🗺️","GPS Route","Ang nakaimbak na route ang pangunahing batayan ng kwalipikadong distansya.")}${C("📡","Sensor Fallback","Ginagamit ang makatwirang step-sensor data kapag walang route.")}${C("⏱️","Ebidensya ng Oras","Dapat tugma ang paggalaw sa tagal ng aktibong oras.")}${C("🔐","Pagsusuri ng Pagmamay-ari","Dapat pag-aari ng account ang mga napiling runner.")}</div><h2>Mga Sinusubaybayan</h2><p>Hakbang, distansya, aktibong oras (hindi kasama ang pause), tinatayang calories at ang route. Pang-impormasyon lamang ang calories at hindi ito currency ng gantimpala.</p><h2>Cross-Device Sync</h2><p>Lokal na nase-save ang progress at nagsi-sync kapag online. Kapag nag-sign in sa ibang device, ipo-pause ang workout sa dating device at ibabalik ng bago ang huling na-sync. Hindi maibabalik sa ibang device ang progress na hindi pa na-sync. Hindi nire-reset ng paglipat mula Wi-Fi patungong mobile data ang workout.</p>`],
["Assets","👟","Mga Runner",`<span class="tag">MGA RUNNER ASSET</span><h1>Mga Runner</h1><p>Ang mga runner ay virtual na gamit. Bawat isa ay may rate kada kilometro at pinakamataas na distansyang mabibilang sa isang workout.</p><div class="grid">${R("cyber","Cyber Aero Walker","₱500","₱3",6)}${R("bio","Bio Surge Trainer","₱1,000","₱5",10)}${R("cobalt","Cobalt Aero Jogger","₱2,000","₱7",20)}${R("vortex","Vortex Blaze Sprint","₱3,500","₱10",35)}</div>${T(["Runner","Presyo","Rate / km","Max na distansya","Kalusugan","Gastos sa repair / health"],[["Cyber Aero Walker","₱500","₱3","6 km","10","₱10"],["Bio Surge Trainer","₱1,000","₱5","10 km","10","₱10"],["Cobalt Aero Jogger","₱2,000","₱7","20 km","10","₱10"],["Vortex Blaze Sprint","₱3,500","₱10","35 km","10","₱10"]])}<figure style="margin:24px 0"><img src="images/stepora-30-day-roi.png" alt="30-day ROI breakdown for runner packages: ₱500 at ₱3 per kilometer, ₱1,000 at ₱5 per kilometer, ₱2,000 at ₱7 per kilometer, and ₱3,500 at ₱10 per kilometer." loading="lazy" style="display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px"><figcaption class="note">30-day earnings illustration based on each runner's daily distance limit.</figcaption></figure><p>Binabawasan ng 1 ang kalusugan ng bawat runner na ginamit sa bawat natapos na workout. ₱10 ang repair sa bawat health point na ibinabalik; ₱100 ang gastos para maibalik ang lahat ng 10 health.</p><div class="shots">${I("market","shot")}</div><h2>Cooldown</h2><p>Ang runner na nagamit sa natapos na workout ay may 12-oras na cooldown bago muling magamit.</p>`],
["Economy","⚡","Reward Engine",`<span class="tag">REWARD ENGINE</span><h1>Reward Engine</h1><div class="call">gantimpala = Σ ( min(distansya, cap ng runner) × rate ng runner )</div><p>Hiwalay na kinakalkula ang bawat napiling runner, nililimitahan ng cap nito ang distansya, at pinagsasama ang mga resulta. Hangganan ang cap sa kalkulasyon, hindi target.</p><div class="stats">${S("4 km","Halimbawang distansya")}${S("₱3","Rate ng Cyber Aero / km")}${S("₱12","Bago ang beripikasyon")}</div><p>Ang workout na hindi pumasa sa beripikasyon ay maaaring makakuha ng mas mababa sa estimate o wala. Isang beses lang binibigyan ng credit ang bawat workout.</p>`],
["Economy","🏁","Team Marathon",`<span class="tag">TEAM POOLS</span><h1>Team Marathon</h1><div class="shots">${I("marathon","shot")}</div><p>Ang Marathon ay team challenge na may takdang oras kung saan naiipon ang beripikadong distansya tungo sa iisang target. Kailangan ng 5 hanggang 10 tinanggap na manlalaro ang lobby.</p>${T(["Target","Bounty pool","Palugit"],[["250 km","₱1,000","7 araw"],["500 km","₱2,500","7 araw"]])}<h2>Mga Kinakailangan</h2><p>Dapat pag-aari ng bawat manlalaro ang Cobalt Aero Jogger at Vortex Blaze Sprint at pumasa sa cooldown at workout-state checks. Ibabawas sa balance ang pantay na kontribusyon ng bawat manlalaro sa simula.</p><h2>Settlement</h2><ul><li><strong>Naabot ang target sa oras:</strong> hahatiin nang pantay ang buong pool sa active roster.</li><li><strong>Hindi naabot:</strong> ibabalik ang mga kontribusyon at walang bounty.</li></ul><p>Ang mga kasali sa nasimulang karera, pati ang umalis nang maaga, ay may tatlong-araw na cooldown.</p>`],
["Economy","💱","Wallet at Rails",`<span class="tag">PAYMENT RAILS</span><h1>Wallet at Rails</h1><div class="logos">${L("gcash","GCash")}${L("maya","Maya")}${L("gotyme","GoTyme")}${L("bank","QRPh")}${L("usdt","USDT")}</div><h2>Deposito</h2>${T(["Rail","Minimum"],[["GCash, Maya, GoTyme, QRPh","₱100"],["USDT (TRC20)","₱800"]])}<p>Ikre-credit lamang sa balance kapag nakumpirmang bayad na ang payment.</p><h2>Withdrawal</h2><p>Ang payout ay sa naka-save na GCash, Maya o GoTyme account, minimum na ₱100, at nangangailangan ng Google Authenticator 2FA. May idinadagdag na 2% fee: ang ₱100 na payout ay ibabawas bilang ₱102. Nananatiling pending ang request hanggang matanggap at maproseso, at ibinabalik kapag tinanggihan.</p>`],
["Network","🔗","Referral Network",`<span class="tag">MGA REFERRAL</span><h1>Referral Network</h1><div class="shots">${I("team","shot")}</div><p>Bawat account ay may natatanging <strong>NT######</strong> referral code at link na maibabahagi. Nagpaparehistro ang mga bagong account gamit ang code o link, at hiwalay ang referral pass sa pagsali sa Marathon.</p><h2>Mga Tuntunin ng Referral Reward</h2><p>Nagsisimula ang hiwalay na kalkulasyon ng reward sa unang pagbili ng runner ng bawat bagong miyembro, mula sa direktang nag-imbita sa miyembrong iyon.</p><ul><li>Nagsisimula ang reward kapag bumili ng kanilang unang runner ang isang inimbitahang miyembro.</li><li>Makakatanggap ng ₱100 ang direktang nag-imbita para sa pagbiling iyon.</li><li>Makakatanggap ng tig-₱50 ang susunod na dalawang kwalipikadong ninuno sa referral chain ng miyembro.</li><li>Walang makakatanggap ng reward lampas sa tatlong henerasyong iyon para sa pagbiling iyon.</li><li>Maaaring makatanggap ang isang tao ng reward mula sa iba’t ibang referral. Hindi magti-trigger ng panibagong reward para sa parehong miyembro ang pagbili ng dagdag na runner ng sinuman, o ang pagbili ng dagdag na runner ng inimbitahang miyembro.</li></ul><h2>Halimbawa</h2><div class="call"><strong>Alex → Joshua → Julia → Gerald → Kim</strong><br>Kapag bumili si Kim ng kanilang unang runner, makakatanggap si Gerald ng ₱100, si Julia ng ₱50, at si Joshua ng ₱50. Walang matatanggap si Alex dahil lampas na siya sa tatlong kwalipikadong henerasyon para sa pagbili ni Kim.</div>`],
["Reference","📖","Glosaryo",`<h1>Glosaryo</h1>${T(["Termino","Kahulugan"],[["Runner","Virtual na gamit na nagtatakda ng rate, cap at cooldown."],["Rate","Gantimpala kada kwalipikadong km, depende sa beripikasyon."],["Distance cap","Pinakamataas na distansyang bibilangin kada runner."],["Cooldown","Panahong hindi magagamit ang runner o pagsali sa Marathon."],["Tinatayang gantimpala","Pansamantalang halaga habang live, hindi pa naka-credit."],["Beripikadong gantimpala","Halagang na-credit pagkatapos ng End &amp; Earn checks."],["Bounty pool","Kabuuang hahatiin sa active roster kapag nagtagumpay."],["Active roster","Mga manlalarong natitira sa team sa pagtatapos."]])}<p class="note">Ang mga rate, limit at fee ay kasalukuyang setting at maaaring magbago.</p>`]]}
let P=PE,lang="en";
const nav=document.getElementById("nav"),art=document.getElementById("art"),toc=document.getElementById("toc");let cur=0;
function build(){nav.innerHTML="";let g="";P.forEach((p,i)=>{if(p[0]!==g){g=p[0];nav.insertAdjacentHTML("beforeend",`<h6>${(lang==="tl"?GT[PE[i][0]]:g).toUpperCase()}</h6>`)}nav.insertAdjacentHTML("beforeend",`<a data-i="${i}">${p[1]} ${p[2]}</a>`)});nav.querySelectorAll("a").forEach(a=>a.onclick=()=>go(+a.dataset.i))}
function go(i){cur=i;const p=P[i],u=UI[lang];art.innerHTML=p[3]+`<div class="next">${i>0?`<div data-i="${i-1}"><small>${u.prev}</small><b>${P[i-1][2]}</b></div>`:""}${i<P.length-1?`<div class="r" data-i="${i+1}"><small>${u.next}</small><b>${P[i+1][2]}</b></div>`:""}</div>`;
const hs=[...art.querySelectorAll("h2")];toc.innerHTML=`<b>${u.on}</b><a data-t='top'>`+p[2]+"</a>"+hs.map((h,k)=>`<a data-t="${k}">${h.textContent}</a>`).join("");
toc.querySelectorAll("a").forEach(a=>a.onclick=()=>{a.dataset.t==="top"?scrollTo({top:0,behavior:"smooth"}):hs[a.dataset.t].scrollIntoView({behavior:"smooth"})});
nav.querySelectorAll("a").forEach((a,k)=>a.classList.toggle("on",k===i));nav.classList.remove("open");scrollTo(0,0);art.querySelectorAll(".next div").forEach(d=>d.onclick=()=>go(+d.dataset.i))}
function setLang(l,keep){lang=l;P=l==="tl"?mkPT():(W.up="up to",PE);document.documentElement.lang=l==="tl"?"tl":"en";const u=UI[l];document.getElementById("wp").textContent=u.wp;document.getElementById("th").textContent=u.th;document.getElementById("lg").textContent="🌐 "+l.toUpperCase();build();go(keep?cur:0);document.getElementById("lm").style.display="none"}
document.getElementById("menu").onclick=()=>nav.classList.toggle("open");
document.getElementById("th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#05070f";r.dataset.theme=d?"light":"dark"};
document.getElementById("lg").onclick=()=>{document.getElementById("lm").style.display="flex"};
document.getElementById("le").onclick=()=>setLang("en",true);document.getElementById("lt").onclick=()=>setLang("tl",true);
document.getElementById("hl").src=IMG.logo;document.getElementById("lml").src=IMG.logo;setLang("en");document.getElementById("lm").style.display="flex";
</script></body></html>
